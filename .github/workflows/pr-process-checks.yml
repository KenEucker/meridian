name: pr-process-checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate PR body
        run: python scripts/process/validate_pr_body.py

      - name: Validate PR title
        run: python scripts/process/validate_conventional_commits.py --event

      - name: Validate process docs
        run: |
          python scripts/process/validate_traceability_matrix.py
          python scripts/process/validate_qa_docs.py
          python scripts/process/validate_repo_process.py

      - name: Validate Composer project if present
        if: hashFiles('composer.json') != ''
        run: composer validate --no-check-publish

      - uses: shivammathur/setup-php@v2
        if: hashFiles('apps/server/composer.json') != ''
        with:
          php-version: "8.5"
          tools: composer:2.10
          coverage: none

      - name: Validate server Composer project
        if: hashFiles('apps/server/composer.json') != ''
        working-directory: apps/server
        run: composer validate --no-check-publish

      - name: Install server Composer dependencies
        if: hashFiles('apps/server/composer.json') != ''
        working-directory: apps/server
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run server Laravel tests
        if: hashFiles('apps/server/composer.json') != ''
        working-directory: apps/server
        run: php artisan test

      - uses: actions/setup-node@v4
        if: hashFiles('package.json', 'apps/server/package.json') != ''
        with:
          node-version: "24"

      - name: Run detected Node checks
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          corepack pnpm install --frozen-lockfile
          for script in lint test typecheck build; do
            if node -e "const scripts = require('./package.json').scripts || {}; process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 1)" "$script"; then
              corepack pnpm run "$script"
            else
              echo "No pnpm script '$script' found; skipping."
            fi
          done

      - name: Run server Node build
        if: hashFiles('apps/server/package.json') != ''
        working-directory: apps/server
        shell: bash
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
