name: pr-process-checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  process:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate PR body
        run: python scripts/process/validate_pr_body.py

      - name: Regression-test PR body validator
        run: python scripts/process/test_validate_pr_body.py

      - name: Validate PR title
        run: python scripts/process/validate_conventional_commits.py --event

      - name: Validate process docs
        run: |
          python scripts/process/validate_traceability_matrix.py
          python scripts/process/validate_qa_docs.py
          python scripts/process/validate_repo_process.py
          python scripts/process/validate_version_strategy.py

      - name: Validate Composer project if present
        if: hashFiles('composer.json') != ''
        run: composer validate --no-check-publish

      - name: Set up PHP for server app
        if: hashFiles('apps/server/composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, xml, simplexml, zip, ctype, bcmath, fileinfo, tokenizer, pdo, sqlite3, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Validate and test Laravel server
        if: hashFiles('apps/server/composer.json') != ''
        working-directory: apps/server
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Verify PostgreSQL migrations
        if: hashFiles('apps/server/composer.json') != ''
        working-directory: apps/server
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: meridian
          DB_USERNAME: meridian
          DB_PASSWORD: meridian
        run: |
          php artisan migrate --force
          php artisan migrate:status

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "24"

      # The deployment bundle's build smoke test, Docker half. Its hermetic half
      # runs inside `pnpm test` below; this step renders both Compose files against
      # the committed sample environment and validates the Dockerfile with
      # `docker build --check`. It is a separate step because it reaches a registry
      # for base image metadata, and a rate-limited registry should be legible as
      # itself rather than as a failure of the repository's other checks.
      - name: Validate the deployment bundle against Docker
        if: hashFiles('deploy/docker/compose.deployment.yaml') != ''
        run: node scripts/deploy/validate-deployment-bundle.mjs --require-docker

      - name: Run detected Node checks
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          corepack pnpm install --frozen-lockfile
          for script in lint test typecheck build; do
            if node -e "const scripts = require('./package.json').scripts || {}; process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 1)" "$script"; then
              corepack pnpm run "$script"
            else
              echo "No pnpm script '$script' found; skipping."
            fi
          done

      # The desktop installer's build smoke test (M19.20). The packaging
      # configuration's hermetic tests run inside `pnpm test` above; this step
      # runs electron-builder against the artifacts `pnpm build` just produced
      # and asserts the host platform's installer exists, carries the root
      # version, and packages the Kiosk client build and no other UI mode's.
      # It is a separate step because electron-builder downloads the Electron
      # distribution, and a mirror outage should be legible as itself rather
      # than as a failure of the repository's other checks.
      - name: Package the desktop installer
        if: hashFiles('apps/kiosk/electron-builder.config.cjs') != ''
        # `corepack enable` puts `pnpm` itself on the PATH: electron-builder's
        # node-module collector invokes it directly rather than through
        # `corepack pnpm`, and the shim resolves the version this repository pins.
        run: |
          corepack enable
          node scripts/release/validate-desktop-packaging.mjs
