name: Requirement implementation
description: Implement product behavior from Meridian requirement IDs.
title: "[Requirement]: "
labels: ["requirement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the product behavior to implement.
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: List requirement IDs and technical spec sections.
      placeholder: |
        Requirements:
        - ORG-001
        Technical spec:
        - Section 28
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use role-aware, testable criteria.
    validations:
      required: true
  - type: textarea
    id: technology_baseline
    attributes:
      label: Technology baseline impact
      description: Confirm docs/meridian-technology-baseline.md was reviewed. List proposed dependency/runtime/tool changes or write "None."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests and QA
      description: Automated tests and human QA scenario expected.
    validations:
      required: true
