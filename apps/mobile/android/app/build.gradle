apply plugin: 'com.android.application'

/*
 * The Meridian version this native project stamps into every build (M19.21).
 *
 * The root package.json is the only Meridian version source of truth
 * (docs/process/versioning-strategy.md), and this wrapper must not declare a
 * version of its own. The version is read at build time rather than committed
 * here, so the production version-bump workflow never has to regenerate this
 * file. A root manifest this block cannot read, or a version that is not
 * numeric major.minor.patch, fails the build: an installable stamped with a
 * wrong or default version looks distributable and must never be emitted.
 *
 * versionCode packs major.minor.patch as major*1_000_000 + minor*1_000 + patch,
 * which increases monotonically as long as minor and patch stay below 1000 —
 * enforced below, because Google Play rejects a versionCode that ever goes
 * backwards.
 */
def meridianRootManifest = rootProject.file('../../../package.json')
def meridianVersionName = { ->
    def parsed
    try {
        parsed = new groovy.json.JsonSlurper().parse(meridianRootManifest)
    } catch (Exception e) {
        throw new GradleException(
            "Cannot read the Meridian root package.json at ${meridianRootManifest}; " +
            "the mobile package version comes from it and nowhere else: ${e.message}")
    }
    if (parsed.name != 'meridian') {
        throw new GradleException(
            "${meridianRootManifest} is not the Meridian root package; " +
            'refusing to stamp the mobile application version from it.')
    }
    def version = parsed.version
    if (!(version instanceof String) || !(version ==~ /\d+\.\d+\.\d+/)) {
        throw new GradleException(
            "The root package.json version must be numeric major.minor.patch, received: ${version}")
    }
    return version
}()
def meridianVersionCode = { version ->
    def (major, minor, patch) = version.tokenize('.').collect { it as int }
    if (minor > 999 || patch > 999) {
        throw new GradleException(
            "versionCode packs major.minor.patch as major*1_000_000 + minor*1_000 + patch; " +
            "minor and patch must stay below 1000, received: ${version}")
    }
    return major * 1_000_000 + minor * 1_000 + patch
}(meridianVersionName)

/*
 * Release signing from the upload keystore (M19.22).
 *
 * Technical spec 26.5 holds every signing credential outside the repository
 * and supplies it through the environment; none of these four variables has
 * an in-repo default, and the keystore itself is never committed. The
 * inventory below is mirrored by apps/mobile/src/releaseSigning.ts, which is
 * what the config tests hold this file against.
 *
 * A release build that cannot resolve all four credentials fails in the
 * task-graph guard below rather than falling back to debug signing or
 * emitting an unsigned artifact that looks distributable. Debug builds are
 * untouched: the credentials are only demanded when a release task is
 * actually scheduled.
 */
def meridianReleaseSigningEnv = [
    'MERIDIAN_ANDROID_UPLOAD_KEYSTORE_FILE',
    'MERIDIAN_ANDROID_UPLOAD_KEYSTORE_PASSWORD',
    'MERIDIAN_ANDROID_UPLOAD_KEY_ALIAS',
    'MERIDIAN_ANDROID_UPLOAD_KEY_PASSWORD',
]
def meridianMissingReleaseCredentials = meridianReleaseSigningEnv.findAll { name ->
    def value = System.getenv(name)
    value == null || value.isEmpty()
}

android {
    namespace = "org.meridian.field"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.meridian.field"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode meridianVersionCode
        versionName meridianVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (meridianMissingReleaseCredentials.isEmpty()) {
            release {
                storeFile file(System.getenv('MERIDIAN_ANDROID_UPLOAD_KEYSTORE_FILE'))
                storePassword System.getenv('MERIDIAN_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MERIDIAN_ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('MERIDIAN_ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (meridianMissingReleaseCredentials.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

/*
 * The fail-closed half of the M19.22 signing contract: if any task of a
 * release variant is scheduled while a credential is missing, the build stops
 * before compiling anything. Without this guard the Android Gradle plugin
 * would happily emit app-release-unsigned.apk, which is exactly the artifact
 * technical spec 26.5 forbids.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTaskScheduled = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*release.*/
    }
    if (!releaseTaskScheduled) {
        return
    }
    if (!meridianMissingReleaseCredentials.isEmpty()) {
        throw new GradleException(
            "Missing Android release signing credentials: " +
            "${meridianMissingReleaseCredentials.join(', ')}. Technical spec 26.5 holds " +
            'the upload keystore and its passwords outside the repository and supplies ' +
            'them through the environment; refusing to build a release that would not ' +
            'be signed from the upload keystore.')
    }
    def uploadKeystore = file(System.getenv('MERIDIAN_ANDROID_UPLOAD_KEYSTORE_FILE'))
    if (!uploadKeystore.isFile()) {
        throw new GradleException(
            "MERIDIAN_ANDROID_UPLOAD_KEYSTORE_FILE points at ${uploadKeystore}, which does " +
            'not exist; refusing to build a release without the upload keystore.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
