name: meridian-database

# Managed Meridian PostgreSQL database service.
#
# This container runs the canonical Meridian PostgreSQL 18 database with logical
# replication enabled and provisions the prerequisites every dependent system
# needs on first boot: the PowerSync least-privilege replication role, the
# dedicated PowerSync bucket-storage database and owner role, and the logical
# replication publication PowerSync consumes. Laravel migrations and seeders run
# against this database with the existing `php artisan` tooling; PowerSync
# connects to it through deploy/powersync.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # wal_level=logical is required for PowerSync logical replication. The wal
    # sender/replication slot limits leave headroom for the PowerSync slot.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-meridian}
      POSTGRES_USER: ${DB_USERNAME:-meridian}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/docker/.env}
      # Consumed by the init script in postgres/initdb.
      POWERSYNC_REPLICATION_USER: ${POWERSYNC_REPLICATION_USER:-powersync_replication}
      POWERSYNC_REPLICATION_PASSWORD: ${POWERSYNC_REPLICATION_PASSWORD:?Set POWERSYNC_REPLICATION_PASSWORD in deploy/docker/.env}
      POWERSYNC_STORAGE_DB: ${POWERSYNC_STORAGE_DB:-powersync_storage}
      POWERSYNC_STORAGE_USER: ${POWERSYNC_STORAGE_USER:-powersync_storage}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?Set POWERSYNC_STORAGE_PASSWORD in deploy/docker/.env}
      POWERSYNC_PUBLICATION: ${POWERSYNC_PUBLICATION:-powersync}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory, so the mount
      # point is /var/lib/postgresql (not /var/lib/postgresql/data).
      - meridian-postgres-data:/var/lib/postgresql
      # Init scripts run only when the data volume is empty (first boot).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${DB_USERNAME:-meridian}" -d "${DB_DATABASE:-meridian}"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  meridian-postgres-data:
    name: meridian-postgres-data

# A named network so the PowerSync stack (deploy/powersync) can optionally attach
# as an external network and reach this service by its `postgres` hostname.
networks:
  default:
    name: meridian
