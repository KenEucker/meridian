name: meridian-database

# Managed Meridian PostgreSQL database service.
#
# This container runs the canonical Meridian PostgreSQL 18 database with logical
# replication enabled. Laravel migrations and seeders run against it with the
# existing `php artisan` tooling.
#
# It provisions no sync roles, no bucket-storage database, and no publication.
# ADR-0003 retired PowerSync, and those three existed only for it; logical
# replication itself stays switched on because node-to-node sync (technical spec
# section 10) is separate from device sync and always was.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # wal_level=logical keeps logical replication available for node sync. The
    # wal sender/replication slot limits leave headroom for a node slot.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-meridian}
      POSTGRES_USER: ${DB_USERNAME:-meridian}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/docker/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 stores data in a major-version subdirectory, so the mount
      # point is /var/lib/postgresql (not /var/lib/postgresql/data).
      - meridian-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${DB_USERNAME:-meridian}" -d "${DB_DATABASE:-meridian}"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  meridian-postgres-data:
    name: meridian-postgres-data

# A named network so another Compose stack can optionally attach as an external
# network and reach this service by its `postgres` hostname.
networks:
  default:
    name: meridian
