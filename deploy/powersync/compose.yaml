services:
  powersync:
    image: journeyapps/powersync-service:1.22.0
    command: ["start", "-r", "unified"]
    restart: unless-stopped
    ports:
      - "${POWERSYNC_PORT:-8080}:80"
    volumes:
      - ./:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:?Set PS_DATA_SOURCE_URI in deploy/powersync/.env}
      PS_DATA_SOURCE_SSLMODE: ${PS_DATA_SOURCE_SSLMODE:-disable}
      PS_BUCKET_STORAGE_URI: ${PS_BUCKET_STORAGE_URI:?Set PS_BUCKET_STORAGE_URI in deploy/powersync/.env}
      PS_BUCKET_STORAGE_SSLMODE: ${PS_BUCKET_STORAGE_SSLMODE:-disable}
      PS_JWKS_URI: ${PS_JWKS_URI:?Set PS_JWKS_URI in deploy/powersync/.env}
      PS_JWT_AUDIENCE: ${PS_JWT_AUDIENCE:-meridian}
      PS_LOG_LEVEL: ${PS_LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/probes/liveness').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
