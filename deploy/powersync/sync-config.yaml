# Authorized device cache projections (M8.2), scoped by the caller's effective
# roles (M16.13; CLIENT-021, CLIENT-022; technical spec 9.5, 11A.7;
# data/API 7.3).
#
# Every authorization scope originates from the signed JWT subject. Client
# subscription parameters are intentionally not used, so a client cannot ask
# PowerSync for another user's, team's, or department's records.
#
# A role-scoped stream reproduces the rule the server's EffectiveRoleResolver
# applies, because a device may not hold what its user could not retrieve
# through the API. Every condition that resolver places on a grant — active team
# membership, an unrevoked grant, the grant's event scope, and, for
# `shift_lead`, the TEAM-009 lead designation — is repeated here. The scope is
# read from the database on every evaluation rather than carried in the token,
# so withdrawing a grant, a lead designation, or a membership changes what
# subsequently replicates without waiting for the device to sign in again.
#
# PowerSync sync-rules dialect constraints that shape this file:
#   * Parameter (with) queries must be self-contained: they may reference
#     auth.user_id() and base tables (including nested subqueries), but must NOT
#     reference another named CTE. A bareword `IN other_cte` inside a with query
#     compiles to a broken json_each() lookup, so each CTE re-derives the current
#     user's staff/team/department scope directly from staff_user.
#   * Data queries may reference named CTEs with `IN cte_name`, and may use
#     INNER JOINs (selected columns must all come from one table) and subqueries.
#   * EXISTS(...) is not supported anywhere; correlated checks use JOINs in data
#     queries instead.
config:
  edition: 3

with:
  current_staff_ids: |
    SELECT staff_id
    FROM staff_user
    WHERE user_id = auth.user_id()

  current_department_ids: |
    SELECT department_id
    FROM department_memberships
    WHERE staff_id IN (
      SELECT staff_id FROM staff_user WHERE user_id = auth.user_id()
    )
      AND archived_at IS NULL

  current_team_ids: |
    SELECT team_id
    FROM team_memberships
    WHERE staff_id IN (
      SELECT staff_id FROM staff_user WHERE user_id = auth.user_id()
    )
      AND archived_at IS NULL

  current_organization_ids: |
    SELECT organization_id
    FROM staff_organization_statuses
    WHERE staff_id IN (
      SELECT staff_id FROM staff_user WHERE user_id = auth.user_id()
    )

  visible_policy_document_ids: |
    SELECT id
    FROM policy_documents
    WHERE state = 'published'
      AND (
        (scope_type = 'organization' AND scope_id IN (
          SELECT organization_id FROM staff_organization_statuses
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
        ))
        OR (scope_type = 'department' AND scope_id IN (
          SELECT department_id FROM department_memberships
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
            AND archived_at IS NULL
        ))
        OR (scope_type = 'team' AND scope_id IN (
          SELECT team_id FROM team_memberships
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
            AND archived_at IS NULL
        ))
      )

  visible_procedure_document_ids: |
    SELECT id
    FROM procedure_documents
    WHERE state = 'published'
      AND (
        (scope_type = 'organization' AND scope_id IN (
          SELECT organization_id FROM staff_organization_statuses
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
        ))
        OR (scope_type = 'department' AND scope_id IN (
          SELECT department_id FROM department_memberships
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
            AND archived_at IS NULL
        ))
        OR (scope_type = 'team' AND scope_id IN (
          SELECT team_id FROM team_memberships
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
            AND archived_at IS NULL
        ))
      )

streams:
  regular_staff_cache:
    auto_subscribe: true
    queries:
      - |
        SELECT id, staff_id, user_id, created_at, updated_at
        FROM staff_user
        WHERE user_id = auth.user_id()
      - |
        SELECT id, organization_id, staff_id, status,
               status_changed_at, created_at, updated_at
        FROM staff_organization_statuses
        WHERE staff_id IN current_staff_ids
      - |
        SELECT id, department_id, staff_id, status,
               created_at, updated_at, archived_at
        FROM department_memberships
        WHERE staff_id IN current_staff_ids
          AND archived_at IS NULL
      - |
        SELECT id, team_id, staff_id, department_membership_id,
               membership_role, created_at, updated_at, archived_at
        FROM team_memberships
        WHERE staff_id IN current_staff_ids
          AND archived_at IS NULL
      - |
        SELECT id, name, slug, created_at, updated_at, archived_at
        FROM organizations
        WHERE id IN current_organization_ids
      - |
        SELECT id, organization_id, name, code, description, default_team_id,
               created_at, updated_at, archived_at
        FROM departments
        WHERE id IN current_department_ids
      - |
        SELECT id, department_id, name, code, description, is_default,
               created_at, updated_at, archived_at
        FROM teams
        WHERE id IN current_team_ids
      - |
        SELECT id, event_id, department_id, created_at, archived_at
        FROM event_department_assignments
        WHERE department_id IN current_department_ids
          AND archived_at IS NULL
      - |
        SELECT id, organization_id, name, slug, starts_at, ends_at, timezone,
               status, active_event_window_starts_at,
               active_event_window_ends_at, created_at, updated_at, archived_at
        FROM events
        WHERE id IN (
          SELECT event_id
          FROM event_department_assignments
          WHERE department_id IN current_department_ids
            AND archived_at IS NULL
        )
        OR id IN (
          SELECT shifts.event_id
          FROM shifts
          INNER JOIN shift_assignments
            ON shift_assignments.shift_id = shifts.id
          WHERE shift_assignments.staff_id IN current_staff_ids
            AND shift_assignments.removed_at IS NULL
        )
      - |
        SELECT id, shift_id, staff_id, assignment_status,
               created_at, updated_at, removed_at
        FROM shift_assignments
        WHERE staff_id IN current_staff_ids
          AND removed_at IS NULL
      - |
        SELECT id, event_id, department_id, eligible_team_id, title,
               department_name_snapshot, team_name_snapshot, starts_at, ends_at,
               capacity, signup_opens_at, signup_closes_at, schedule_lock_at,
               created_at, updated_at, cancelled_at
        FROM shifts
        WHERE id IN (
          SELECT shift_id
          FROM shift_assignments
          WHERE staff_id IN current_staff_ids
            AND removed_at IS NULL
        )
      - |
        SELECT id, organization_id, scope_type, scope_id, title, slug,
               markdown_source, state, document_revision, fragment_revision,
               published_at, archived_at, created_at, updated_at
        FROM policy_documents
        WHERE id IN visible_policy_document_ids
      - |
        SELECT id, organization_id, scope_type, scope_id, title, slug,
               markdown_source, state, document_revision, fragment_revision,
               published_at, archived_at, created_at, updated_at
        FROM procedure_documents
        WHERE id IN visible_procedure_document_ids
      - |
        SELECT id, document_type, document_id, fragment_id, token,
               fragment_version_at_last_edit, created_at, updated_at
        FROM document_fragment_references
        WHERE (document_type = 'policy' AND document_id IN visible_policy_document_ids)
          OR (document_type = 'procedure' AND document_id IN visible_procedure_document_ids)
      - |
        SELECT id, organization_id, scope_type, scope_id, name, slug,
               markdown_source, version, created_at, updated_at
        FROM document_fragments
        WHERE id IN (
          SELECT fragment_id
          FROM document_fragment_references
          WHERE (document_type = 'policy' AND document_id IN visible_policy_document_ids)
            OR (document_type = 'procedure' AND document_id IN visible_procedure_document_ids)
        )
      - |
        SELECT id, organization_id, scope_type, scope_id, document_type,
               document_id, requirement_context, active, created_at, updated_at
        FROM document_acknowledgment_requirements
        WHERE active = true
          AND (
            (document_type = 'policy' AND document_id IN visible_policy_document_ids)
            OR (document_type = 'procedure' AND document_id IN visible_procedure_document_ids)
          )
      - |
        SELECT id, user_id, staff_id, document_type, document_id,
               document_revision, fragment_revision, scope_type, scope_id,
               acknowledged_at, created_at
        FROM document_acknowledgments
        WHERE user_id = auth.user_id()

  shift_lead_cache:
    auto_subscribe: true
    with:
      # Teams the active user holds an active shift-lead grant on, as a
      # designated lead. A shift-lead grant is held by the team but exercised by
      # the members designated `membership_role = 'lead'` (TEAM-009), which is
      # the rule EffectiveRoleResolver applies: without it, every member of a
      # granted team would replicate the roster their lead reads.
      # Self-contained: the current-team scope is re-derived from staff_user
      # rather than referencing the current_team_ids CTE, which is not permitted
      # inside a parameter query.
      shift_lead_team_ids: |
        SELECT team_id
        FROM team_grants
        WHERE team_id IN (
          SELECT team_id FROM team_memberships
          WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
            AND membership_role = 'lead'
            AND archived_at IS NULL
        )
          AND revoked_at IS NULL
          AND permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'shift_lead'
          )

    queries:
      # Shifts for led teams, honouring each grant's event scope. Event-scoped
      # correlation requires a JOIN, which is only permitted in data queries, so
      # the designation-aware team scope arrives as shift_lead_team_ids.
      - |
        SELECT shifts.id, shifts.event_id, shifts.department_id, shifts.eligible_team_id,
               shifts.title, shifts.department_name_snapshot, shifts.team_name_snapshot,
               shifts.starts_at, shifts.ends_at, shifts.capacity, shifts.signup_opens_at,
               shifts.signup_closes_at, shifts.schedule_lock_at, shifts.created_at,
               shifts.updated_at, shifts.cancelled_at
        FROM shifts
        INNER JOIN team_grants
          ON team_grants.team_id = shifts.eligible_team_id
        WHERE team_grants.team_id IN shift_lead_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'shift_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = shifts.event_id
          )
      - |
        SELECT shift_assignments.id, shift_assignments.shift_id, shift_assignments.staff_id,
               shift_assignments.assignment_status, shift_assignments.created_at,
               shift_assignments.updated_at, shift_assignments.removed_at
        FROM shift_assignments
        INNER JOIN shifts
          ON shifts.id = shift_assignments.shift_id
        INNER JOIN team_grants
          ON team_grants.team_id = shifts.eligible_team_id
        WHERE shift_assignments.removed_at IS NULL
          AND team_grants.team_id IN shift_lead_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'shift_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = shifts.event_id
          )
      - |
        SELECT id, team_id, staff_id, department_membership_id,
               membership_role, created_at, updated_at, archived_at
        FROM team_memberships
        WHERE team_id IN shift_lead_team_ids
          AND archived_at IS NULL
      - |
        SELECT id, legal_name, preferred_name, handle,
               created_at, updated_at, archived_at
        FROM staff
        WHERE id IN (
          SELECT staff_id
          FROM team_memberships
          WHERE team_id IN shift_lead_team_ids
            AND archived_at IS NULL
        )
        OR id IN (
          SELECT shift_assignments.staff_id
          FROM shift_assignments
          INNER JOIN shifts
            ON shifts.id = shift_assignments.shift_id
          INNER JOIN team_grants
            ON team_grants.team_id = shifts.eligible_team_id
          WHERE shift_assignments.removed_at IS NULL
            AND team_grants.team_id IN shift_lead_team_ids
            AND team_grants.revoked_at IS NULL
            AND team_grants.permission_role_id IN (
              SELECT id FROM permission_roles WHERE code = 'shift_lead'
            )
            AND (
              team_grants.event_id IS NULL
              OR team_grants.event_id = shifts.event_id
            )
        )

  department_lead_cache:
    auto_subscribe: true
    with:
      # Departments the active user leads. Self-contained: team membership,
      # grant, and team -> department hops are all expressed as nested subqueries
      # anchored on auth.user_id() rather than referencing other CTEs.
      department_lead_department_ids: |
        SELECT department_id
        FROM teams
        WHERE id IN (
          SELECT team_id
          FROM team_grants
          WHERE team_id IN (
            SELECT team_id FROM team_memberships
            WHERE staff_id IN (SELECT staff_id FROM staff_user WHERE user_id = auth.user_id())
              AND archived_at IS NULL
          )
            AND revoked_at IS NULL
            AND permission_role_id IN (
              SELECT id FROM permission_roles WHERE code = 'department_lead'
            )
        )

    queries:
      - |
        SELECT id, organization_id, name, code, description, default_team_id,
               created_at, updated_at, archived_at
        FROM departments
        WHERE id IN department_lead_department_ids
      - |
        SELECT id, department_id, name, code, description, is_default,
               created_at, updated_at, archived_at
        FROM teams
        WHERE department_id IN department_lead_department_ids
      - |
        SELECT id, department_id, staff_id, status,
               created_at, updated_at, archived_at
        FROM department_memberships
        WHERE department_id IN department_lead_department_ids
          AND archived_at IS NULL
      - |
        SELECT id, team_id, staff_id, department_membership_id,
               membership_role, created_at, updated_at, archived_at
        FROM team_memberships
        WHERE department_membership_id IN (
          SELECT id
          FROM department_memberships
          WHERE department_id IN department_lead_department_ids
            AND archived_at IS NULL
        )
          AND archived_at IS NULL
      - |
        SELECT id, legal_name, preferred_name, handle,
               created_at, updated_at, archived_at
        FROM staff
        WHERE id IN (
          SELECT staff_id
          FROM department_memberships
          WHERE department_id IN department_lead_department_ids
            AND archived_at IS NULL
        )
      # Event-scoped correlation requires a JOIN, which is only permitted in data
      # queries, so the department-lead grant scope is joined here directly.
      - |
        SELECT event_department_assignments.id, event_department_assignments.event_id,
               event_department_assignments.department_id,
               event_department_assignments.created_at,
               event_department_assignments.archived_at
        FROM event_department_assignments
        INNER JOIN teams
          ON teams.department_id = event_department_assignments.department_id
        INNER JOIN team_grants
          ON team_grants.team_id = teams.id
        WHERE event_department_assignments.archived_at IS NULL
          AND team_grants.team_id IN current_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'department_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = event_department_assignments.event_id
          )
      - |
        SELECT events.id, events.organization_id, events.name, events.slug,
               events.starts_at, events.ends_at, events.timezone, events.status,
               events.active_event_window_starts_at, events.active_event_window_ends_at,
               events.created_at, events.updated_at, events.archived_at
        FROM events
        INNER JOIN event_department_assignments
          ON event_department_assignments.event_id = events.id
        INNER JOIN teams
          ON teams.department_id = event_department_assignments.department_id
        INNER JOIN team_grants
          ON team_grants.team_id = teams.id
        WHERE event_department_assignments.archived_at IS NULL
          AND team_grants.team_id IN current_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'department_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = event_department_assignments.event_id
          )
      - |
        SELECT shifts.id, shifts.event_id, shifts.department_id, shifts.eligible_team_id,
               shifts.title, shifts.department_name_snapshot, shifts.team_name_snapshot,
               shifts.starts_at, shifts.ends_at, shifts.capacity, shifts.signup_opens_at,
               shifts.signup_closes_at, shifts.schedule_lock_at, shifts.created_at,
               shifts.updated_at, shifts.cancelled_at
        FROM shifts
        INNER JOIN teams
          ON teams.department_id = shifts.department_id
        INNER JOIN team_grants
          ON team_grants.team_id = teams.id
        WHERE team_grants.team_id IN current_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'department_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = shifts.event_id
          )
      - |
        SELECT shift_assignments.id, shift_assignments.shift_id, shift_assignments.staff_id,
               shift_assignments.assignment_status, shift_assignments.created_at,
               shift_assignments.updated_at, shift_assignments.removed_at
        FROM shift_assignments
        INNER JOIN shifts
          ON shifts.id = shift_assignments.shift_id
        INNER JOIN teams
          ON teams.department_id = shifts.department_id
        INNER JOIN team_grants
          ON team_grants.team_id = teams.id
        WHERE shift_assignments.removed_at IS NULL
          AND team_grants.team_id IN current_team_ids
          AND team_grants.revoked_at IS NULL
          AND team_grants.permission_role_id IN (
            SELECT id FROM permission_roles WHERE code = 'department_lead'
          )
          AND (
            team_grants.event_id IS NULL
            OR team_grants.event_id = shifts.event_id
          )
      - |
        SELECT id, organization_id, scope_type, scope_id, title, slug,
               markdown_source, state, document_revision, fragment_revision,
               published_at, archived_at, created_at, updated_at
        FROM policy_documents
        WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
          OR (scope_type = 'team' AND scope_id IN (
            SELECT id FROM teams WHERE department_id IN department_lead_department_ids
          ))
      - |
        SELECT id, organization_id, scope_type, scope_id, title, slug,
               markdown_source, state, document_revision, fragment_revision,
               published_at, archived_at, created_at, updated_at
        FROM procedure_documents
        WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
          OR (scope_type = 'team' AND scope_id IN (
            SELECT id FROM teams WHERE department_id IN department_lead_department_ids
          ))
      - |
        SELECT id, document_type, document_id, fragment_id, token,
               fragment_version_at_last_edit, created_at, updated_at
        FROM document_fragment_references
        WHERE document_id IN (
          SELECT id FROM policy_documents
          WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
            OR (scope_type = 'team' AND scope_id IN (
              SELECT id FROM teams WHERE department_id IN department_lead_department_ids
            ))
        )
        OR document_id IN (
          SELECT id FROM procedure_documents
          WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
            OR (scope_type = 'team' AND scope_id IN (
              SELECT id FROM teams WHERE department_id IN department_lead_department_ids
            ))
        )
      - |
        SELECT id, organization_id, scope_type, scope_id, name, slug,
               markdown_source, version, created_at, updated_at
        FROM document_fragments
        WHERE id IN (
          SELECT fragment_id FROM document_fragment_references
          WHERE document_id IN (
            SELECT id FROM policy_documents
            WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
              OR (scope_type = 'team' AND scope_id IN (
                SELECT id FROM teams WHERE department_id IN department_lead_department_ids
              ))
          )
          OR document_id IN (
            SELECT id FROM procedure_documents
            WHERE (scope_type = 'department' AND scope_id IN department_lead_department_ids)
              OR (scope_type = 'team' AND scope_id IN (
                SELECT id FROM teams WHERE department_id IN department_lead_department_ids
              ))
          )
        )
        OR (scope_type = 'department' AND scope_id IN department_lead_department_ids)
        OR (scope_type = 'team' AND scope_id IN (
          SELECT id FROM teams WHERE department_id IN department_lead_department_ids
        ))

# Deferred to owning tasks because their canonical tables or runtime paths do
# not yet exist: Field Reports/forms, attendance operations, readiness state,
# incident last-view caches, maps, client SQLite schemas, and offline uploads.
