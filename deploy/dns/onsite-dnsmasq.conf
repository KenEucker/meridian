# Meridian event network DNS — dnsmasq.
#
# For the Meridian-controlled travel router or access point in the on-site kit
# (technical spec 8.3). dnsmasq is what OpenWrt and most small routers already run
# for DHCP and DNS, so this is a drop-in fragment rather than a new service:
#
#   /etc/dnsmasq.d/meridian-onsite.conf   (or OpenWrt: /etc/dnsmasq.conf include)
#
# What it does is resolve the node's public event hostname to the node's LAN
# address. That is the whole trick behind on-site HTTPS: the certificate is issued
# for a real public name before the event, and during the event this DNS answer
# points that name at the server on the field network. Browsers trust the name
# they were given and never learn the address changed.
#
# Replace every value below. `example.org` and the addresses are deliberately fake
# (technical spec 26.2: sample configs carry fake values only).

# ---------------------------------------------------------------------------
# The event hostname
# ---------------------------------------------------------------------------
# The name on the node's certificate, answered with the node's LAN address.
# Devices on this network reach https://juplaya-2027-onsite.example.org and land
# on the on-site node.
address=/juplaya-2027-onsite.example.org/10.10.0.2

# ---------------------------------------------------------------------------
# Answer for this name even when the internet is present
# ---------------------------------------------------------------------------
# An `address=` entry already wins over an upstream answer, so the public DNS
# record for the same name — which points at central — is not consulted on this
# network. That is intended: on the event network, the event hostname means the
# node in the tent, not the node in the datacenter.
#
# Upstream resolution for every other name still works when the uplink does, and
# stops answering when it does not. Meridian's own operation does not depend on
# it: the node and the devices are on this network together.

# ---------------------------------------------------------------------------
# The on-site convention names (RFC 8375; technical spec 8.4)
# ---------------------------------------------------------------------------
# meridian.home.arpa is the main on-site node, and additional nodes take
# meridian2, meridian3 in order. The installed Meridian Field app assumes these
# names on a device nobody has configured, so answering them is what makes a
# phone find the node with no settings. home.arpa exists for exactly this: it
# is the special-use domain a local network answers for itself, and it is never
# resolvable from the internet — which is also why the app reaches these names
# over plain HTTP with a scoped allowance rather than a certificate no public
# authority would issue (technical spec 8.5).
address=/meridian.home.arpa/10.10.0.2

# Additional nodes, in convention order. Uncomment as the kit grows.
#address=/meridian2.home.arpa/10.10.0.3
#address=/meridian3.home.arpa/10.10.0.4

# home.arpa is answered here or not at all (RFC 8375 section 4): never forward
# it upstream, where the only possible answers are silence and lies.
server=/home.arpa/#

# ---------------------------------------------------------------------------
# Do not forward the event hostname upstream
# ---------------------------------------------------------------------------
# Belt and braces for a router that has been configured with a forwarding rule
# for the parent domain.
server=/juplaya-2027-onsite.example.org/#

# ---------------------------------------------------------------------------
# mDNS coexistence
# ---------------------------------------------------------------------------
# `.local` names are handled by mDNS on the devices themselves, not here, and a
# DNS server that answers for `.local` breaks that. Local discovery over `.local`
# is useful for the installed app and for admin and debug access, and is not
# sufficient for browser-trusted HTTPS (technical spec 8.5) — which is why the
# event hostname above exists at all.
local=/local/
bogus-priv

# ---------------------------------------------------------------------------
# DHCP
# ---------------------------------------------------------------------------
# The router hands out addresses and points devices at itself for DNS, which is
# what makes the answer above reach them. The node itself must hold a fixed
# address, either statically configured on the node or reserved here.
dhcp-range=10.10.0.50,10.10.0.200,12h
dhcp-option=option:dns-server,10.10.0.1

# The node's reservation. Replace the MAC with the server's own.
dhcp-host=00:00:00:00:00:00,10.10.0.2,meridian-onsite
