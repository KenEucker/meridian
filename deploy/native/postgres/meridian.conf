# Installed to /etc/postgresql/18/main/conf.d/meridian.conf.
#
# The `command:` block from the postgres service in compose.deployment.yaml.
# Logical replication stays switched on because node-to-node sync (technical
# spec section 10) is separate from device sync and always was; the wal sender
# and replication slot limits leave headroom for a node slot.
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# The Compose deployment published no host port, so the database was reachable
# only from the stack's own network. The equivalent here is refusing to leave
# the loopback interface: the server, worker, and scheduler are all on this
# host. A deployment that puts the database on another machine changes this and
# adds the matching pg_hba.conf rule — and should not expose it to a field
# network either way.
listen_addresses = 'localhost'
