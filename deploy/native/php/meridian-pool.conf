; The php-fpm pool that replaces the `server` container.
;
; Installed to /etc/php/@PHP_VERSION@/fpm/pool.d/meridian.conf with
; @PHP_VERSION@ substituted. The stock `www` pool is removed: it would listen on
; a second socket and serve nothing.

[meridian]

user = www-data
group = www-data

; A unix socket rather than the container stack's server:9000. Group-owned by
; caddy so the proxy can reach it and nothing else on the host can.
listen = /run/php/php@PHP_VERSION@-fpm-meridian.sock
listen.owner = www-data
listen.group = caddy
listen.mode = 0660

; Sized for a mini PC. Meridian's slow requests are photo uploads and
; spreadsheet imports rather than concurrent page renders, so a small pool that
; keeps memory headroom for PostgreSQL beats a large idle one. Raise pm.max_children
; if `systemctl status` starts logging "server reached pm.max_children".
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; A request that outlives this is a stuck one. Photo uploads and imports are
; slower than a page render, which is why it is not the 30s default; it matches
; the proxy's `read_timeout 120s`.
request_terminate_timeout = 120s

; Laravel reads apps/server/.env, so the pool does not need the host environment
; passed through. clear_env stays on (the default) for that reason.
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/php-fpm-meridian.log
php_admin_flag[log_errors] = on
