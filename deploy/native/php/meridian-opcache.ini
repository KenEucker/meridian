; The opcache block from deploy/docker/Dockerfile's php-base stage.
;
; validate_timestamps=0 was safe in the image because code never changed under a
; running container — a new build was a new image. On a host, a `git pull`
; changes code under a running pool, so deploy-release.sh restarts php-fpm as
; its last step. If you would rather trade the throughput for not having to,
; set validate_timestamps=1 and revalidate_freq=2.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
