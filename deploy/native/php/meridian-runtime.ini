; The runtime block from deploy/docker/Dockerfile's php-base stage.
;
; Uploaded Field Report photos and spreadsheet imports arrive through PHP, so
; the request body limits belong to the runtime and not to the proxy alone.
; post_max_size matches the `request_body max_size 40MB` in
; deploy/caddy/meridian.snippet — the proxy refuses an oversized body first
; because that is the cheaper place to refuse it.
memory_limit=512M
upload_max_filesize=32M
post_max_size=40M
expose_php=Off
