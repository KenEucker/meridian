# /etc/systemd/system/caddy.service.d/meridian.conf
#
# Points the packaged Caddy at the Meridian bundle's own Caddyfiles and supplies
# the environment they substitute. This is the `web` service's `command` and
# `environment` blocks from compose.deployment.yaml, as a systemd drop-in.
#
# MERIDIAN_CADDYFILE chooses which configuration runs, unchanged from the
# Compose deployment:
#   /etc/caddy/Caddyfile           internet-reachable node, ACME
#   /etc/caddy/Caddyfile.wildcard  as above, plus organization subdomains
#   /etc/caddy/Caddyfile.onsite    event node, pre-provisioned certificate

[Service]
EnvironmentFile=/etc/meridian-proxy.env

# Empty assignment clears the packaged ExecStart before replacing it.
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config ${MERIDIAN_CADDYFILE} --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config ${MERIDIAN_CADDYFILE} --adapter caddyfile --force

# The proxy reads the server's public files and the pre-provisioned certificate
# directory; it writes only its own data and config.
ReadOnlyPaths=/var/www/meridian
